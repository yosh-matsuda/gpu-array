name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the HIP tests for gfx942 (Release) and runs the ctest suite on a simulated
# AMD Instinct MI300X (https://github.com/pantheongpu/pantheonsim). A simulator
# cannot reproduce hardware-specific behavior or timing, so it complements
# real-GPU testing and does not replace it.

on:
    workflow_dispatch:
    pull_request:
        branches: [main]
        paths:
            - "include/**"
            - "test/**"
            - "CMakeLists.txt"
            - "vcpkg.json"
            - ".github/workflows/gpu-sim.yml"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    hip-test:
        name: HIP ${{ matrix.rocm }} (ROCm Clang and simulated MI300X)
        runs-on: ubuntu-24.04
        timeout-minutes: 180
        strategy:
            fail-fast: false
            matrix:
                rocm: ["7.1"]

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  persist-credentials: false

            - name: Set up the simulated GPU and ROCm
              uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
              with:
                  gpu: amd/mi300x
                  cuda-toolkit: none
                  rocm: ${{ matrix.rocm }}

            # Same dependencies as tests.yml (gtest and nameof from vcpkg).
            - name: Install dependencies
              run: vcpkg install --triplet x64-linux

            - name: Configure
              run: |
                  cmake -S . -B build -G Ninja \
                    -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
                    -DVCPKG_TARGET_TRIPLET=x64-linux \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_C_COMPILER=/opt/rocm/lib/llvm/bin/clang \
                    -DCMAKE_CXX_COMPILER=/opt/rocm/lib/llvm/bin/clang++ \
                    -DENABLE_HIP=ON \
                    -DCMAKE_HIP_PLATFORM=amd \
                    -DCMAKE_HIP_ARCHITECTURES=gfx942 \
                    -DCMAKE_PREFIX_PATH=/opt/rocm

            - name: Build
              run: cmake --build build -j3

            - name: Test
              run: vgpu run ctest --test-dir build --output-on-failure --no-tests=error
